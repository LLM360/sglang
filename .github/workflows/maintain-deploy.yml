name: Maintain deploy branch

on:
  schedule:
    - cron: '0 9 * * *'  # 2 AM Pacific (PDT) / 1 AM PST. GitHub Actions cron is UTC only; accepts the ~1hr DST drift.
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if no changes detected'
        type: boolean
        default: false

env:
  # Base for the deploy branch reset. LLM360/sglang:llm360-main holds our
  # stabilized patch stack (sglang-miles, MTP, TITO, rail-map, etc.) on top
  # of sgl-project/sglang. Deploy = DEPLOY_BASE + open LLM360-head PRs.
  DEPLOY_BASE: LLM360/sglang
  DEPLOY_BASE_BRANCH: llm360-main
  # Real upstream. Unlike other LLM360 forks (miles/harbor/smg/Megatron-LM),
  # sgl-project/sglang does NOT contain our patch stack, so we cannot use it
  # as DEPLOY_BASE. But we still want open upstream PRs with LLM360-owned
  # head branches (e.g. fixes authored by team members against sgl-project
  # awaiting upstream review) to land in the nightly image so the next
  # build picks them up without waiting on upstream merge.
  REAL_UPSTREAM: sgl-project/sglang
  REAL_UPSTREAM_BRANCH: main
  # Space-separated list of upstream PR head branches to exclude from the
  # octopus merge. The `blocked` label filter only applies to fork-only
  # PRs (we can't label arbitrary upstream PRs), so upstream PRs that
  # are either superseded by a fork-local mirror PR or longstanding
  # conflicts we don't want in deploy are listed explicitly here.
  # Remove an entry once the underlying PR merges upstream or is closed.
  #
  # fix/json-ib-device-passthrough (sgl-project/sglang#23003): rail-map JSON
  #   support for --disaggregation-ib-device. Superseded by LLM360/sglang#9
  #   which applies the same fix on top of llm360-main (no line-drift conflict).
  #   The upstream PR stays open to track the fix landing in sgl-project.
  SKIP_UPSTREAM_BRANCHES: "fix/json-ib-device-passthrough"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fingerprint.outputs.skip }}
      state: ${{ steps.fingerprint.outputs.state }}
      branches: ${{ steps.fingerprint.outputs.branches }}
    steps:
      - name: Compute desired state and compare
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
        run: |
          UPSTREAM_SHA=$(gh api "repos/${DEPLOY_BASE}/commits/${DEPLOY_BASE_BRANCH}" --jq '.sha' 2>/dev/null || echo "unknown")

          FORK_OWNER="${REPO%%/*}"
          NOT_BLOCKED='select(([.labels[].name] | index("blocked")) == null)'

          # Upstream-excluded branches (see SKIP_UPSTREAM_BRANCHES in env).
          SKIP_JQ_LIST=$(printf '%s\n' $SKIP_UPSTREAM_BRANCHES | jq -R -s -c 'split("\n") | map(select(length > 0))')
          NOT_SKIPPED="select(.head.ref as \$r | ${SKIP_JQ_LIST} | index(\$r) | not)"

          # Branches with open cross-fork PRs against DEPLOY_BASE's branch on
          # LLM360/sglang whose head repo is owned by LLM360.
          UPSTREAM_PR_STATE=$(gh api "repos/${DEPLOY_BASE}/pulls?state=open&base=${DEPLOY_BASE_BRANCH}&per_page=100" \
            --jq "[.[] | select(.head.repo.owner.login == \"${FORK_OWNER}\") | ${NOT_SKIPPED}] | sort_by(.head.ref) | map(.head.ref + \"=\" + .head.sha) | join(\",\")")

          UPSTREAM_BRANCHES=$(gh api "repos/${DEPLOY_BASE}/pulls?state=open&base=${DEPLOY_BASE_BRANCH}&per_page=100" \
            --jq "[.[] | select(.head.repo.owner.login == \"${FORK_OWNER}\") | ${NOT_SKIPPED}] | .[].head.ref" | tr '\n' ' ')

          # Branches with open PRs against the fork's own llm360-main (fork-only changes), excluding blocked PRs
          FORK_PR_STATE=$(gh api "repos/${REPO}/pulls?state=open&base=${DEPLOY_BASE_BRANCH}&per_page=100" \
            --jq "[.[] | select(.head.repo.full_name == \"${REPO}\") | ${NOT_BLOCKED}] | sort_by(.head.ref) | map(.head.ref + \"=\" + .head.sha) | join(\",\")")

          FORK_BRANCHES=$(gh api "repos/${REPO}/pulls?state=open&base=${DEPLOY_BASE_BRANCH}&per_page=100" \
            --jq "[.[] | select(.head.repo.full_name == \"${REPO}\") | ${NOT_BLOCKED}] | .[].head.ref" | tr '\n' ' ')

          # Open PRs against the REAL upstream (sgl-project/sglang:main) whose
          # head branch lives on an LLM360-owned fork. Catches in-flight fixes
          # the team authored against upstream that haven't merged yet. Skip
          # entries in SKIP_UPSTREAM_BRANCHES (e.g. already mirrored into the
          # fork via a conflict-free PR).
          REAL_UPSTREAM_PR_STATE=$(gh api "repos/${REAL_UPSTREAM}/pulls?state=open&base=${REAL_UPSTREAM_BRANCH}&per_page=100" \
            --jq "[.[] | select(.head.repo.owner.login == \"${FORK_OWNER}\") | ${NOT_SKIPPED}] | sort_by(.head.ref) | map(.head.ref + \"=\" + .head.sha) | join(\",\")")

          REAL_UPSTREAM_BRANCHES=$(gh api "repos/${REAL_UPSTREAM}/pulls?state=open&base=${REAL_UPSTREAM_BRANCH}&per_page=100" \
            --jq "[.[] | select(.head.repo.owner.login == \"${FORK_OWNER}\") | ${NOT_SKIPPED}] | .[].head.ref" | tr '\n' ' ')

          # Deduplicate: fork cross-base PRs first, then fork-only, then real-upstream.
          # Earlier sources win if the same branch name appears in multiple queries
          # (shouldn't happen in practice, but keeps fingerprints deterministic).
          BRANCHES="$UPSTREAM_BRANCHES"
          for fb in $FORK_BRANCHES; do
            if ! echo " $BRANCHES " | grep -q " $fb "; then
              BRANCHES="$BRANCHES $fb"
            fi
          done
          for rb in $REAL_UPSTREAM_BRANCHES; do
            if ! echo " $BRANCHES " | grep -q " $rb "; then
              BRANCHES="$BRANCHES $rb"
            fi
          done

          # Combine state fingerprints in the same order as BRANCHES.
          PR_STATE="${UPSTREAM_PR_STATE}"
          if [ -n "$FORK_PR_STATE" ]; then
            PR_STATE="${PR_STATE:+${PR_STATE},}${FORK_PR_STATE}"
          fi
          if [ -n "$REAL_UPSTREAM_PR_STATE" ]; then
            PR_STATE="${PR_STATE:+${PR_STATE},}${REAL_UPSTREAM_PR_STATE}"
          fi

          STATE="${UPSTREAM_SHA}|${PR_STATE}"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "Desired state: $STATE"

          CURRENT=$(gh api "repos/${REPO}/commits/deploy" \
            --jq '.commit.message' 2>/dev/null \
            | grep '^state:' | head -1 | cut -d: -f2- || echo "")

          echo "Current state: $CURRENT"

          if [ "$CURRENT" = "$STATE" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes detected, skipping rebuild"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  rebuild:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch deploy base
        run: |
          # DEPLOY_BASE is also origin (LLM360/sglang), so deploy_base_branch is
          # already fetched via actions/checkout above. Kept explicit for clarity.
          git fetch origin "${DEPLOY_BASE_BRANCH}"

      - name: Build deploy branch
        env:
          PR_BRANCHES: ${{ needs.check.outputs.branches }}
        run: |
          git checkout -B deploy "origin/${DEPLOY_BASE_BRANCH}"

          # All discoverable branches (cross-base, fork-only, real-upstream-with-
          # LLM360-head) live on origin = LLM360/sglang. Upstream PRs whose head
          # branch is on LLM360/sglang are fetched via the same `git fetch origin`
          # since the fork hosts the branch regardless of where the PR points.
          MERGED=""
          FAILED=""
          for branch in $PR_BRANCHES; do
            echo "Merging $branch..."
            if git merge "origin/$branch" --no-edit -m "Deploy: merge $branch"; then
              MERGED="$MERGED $branch"
            else
              echo "::error::Merge conflict on $branch, skipping"
              git merge --abort
              FAILED="$FAILED $branch"
            fi
          done

          echo "Successfully merged:${MERGED:-<none>}"
          if [ -n "$FAILED" ]; then
            echo "::warning::Failed to merge (conflicts):$FAILED"
          fi
          echo "FAILED_BRANCHES=$FAILED" >> "$GITHUB_ENV"

      - name: Preserve fork-local .github/workflows
        # GitHub Actions only reads workflow files on the branch where the trigger
        # fires. Fork-local CI (e.g. release-binary.yml that triggers on push to
        # deploy) lives on fork llm360-main, not upstream. Overlay fork-llm360-main workflows
        # onto the deploy tree so those workflows survive the rebuild.
        run: |
          git fetch origin "${DEPLOY_BASE_BRANCH}"
          if git ls-tree -r "origin/${DEPLOY_BASE_BRANCH}" -- .github/workflows/ 2>/dev/null | grep -q .
          then
            git checkout "origin/${DEPLOY_BASE_BRANCH}" -- .github/workflows/
            git add .github/workflows/
            git diff --cached --quiet || \
              git commit -m "Deploy: preserve fork-local .github/workflows from ${DEPLOY_BASE_BRANCH}"
          fi

      - name: Stamp fingerprint and push
        env:
          STATE: ${{ needs.check.outputs.state }}
        run: |
          git commit --allow-empty -m "state:${STATE}"
          git push origin deploy --force

      - name: Report merge conflicts
        if: always() && needs.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="Deploy: merge conflict"
          EXISTING=$(gh issue list --label deploy-conflict --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$FAILED_BRANCHES" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Resolved: all branches merged cleanly."
            fi
            exit 0
          fi

          BODY=$(printf "The following branches failed to merge into deploy:\n\n")
          for b in $FAILED_BRANCHES; do
            BODY=$(printf "%s\n- \`%s\`" "$BODY" "$b")
          done
          BODY=$(printf "%s\n\nThis issue auto-closes when the next build merges all branches cleanly." "$BODY")

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$BODY" --label deploy-conflict
          fi
